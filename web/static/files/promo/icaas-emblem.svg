<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t">
  <title id="t">ICAAS emblem: autonomous systems on the horizon</title>
  <defs>
    <clipPath id="disc"><circle cx="100" cy="100" r="95"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8ece8"/>
      <stop offset="1" stop-color="#f3d9d1"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5292"/>
      <stop offset="1" stop-color="#1d3d72"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#disc)">
    <rect width="200" height="200" fill="url(#sky)"/>
    <!-- setting sun, three rings like a radar sweep -->
    <circle cx="100" cy="132" r="78" fill="#f2c4b6"/>
    <circle cx="100" cy="132" r="58" fill="#ee9d85"/>
    <circle cx="100" cy="132" r="40" fill="#e8694b"/>
    <!-- planned trajectory -->
    <path d="M30 70 C 58 40, 104 34, 124 58" fill="none" stroke="#142c55" stroke-width="1.6" stroke-dasharray="2.5 3.5" stroke-linecap="round"/>
    <circle cx="30" cy="70" r="2.6" fill="#142c55"/>
    <circle cx="74" cy="44" r="2.2" fill="#e8694b"/>
    <!-- satellite -->
    <g transform="translate(139 37) rotate(-24) scale(.85)" fill="#142c55">
      <rect x="-4.5" y="-4" width="9" height="8" rx="1.2"/>
      <rect x="-19" y="-3" width="12" height="6" rx="1"/>
      <rect x="7" y="-3" width="12" height="6" rx="1"/>
      <rect x="-7" y="-0.6" width="14" height="1.2"/>
      <path d="M0 4 v4 m-3 0 h6" stroke="#142c55" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- drone -->
    <g fill="#142c55">
      <rect x="123" y="63.5" width="34" height="2.6" rx="1.3"/>
      <rect x="133.5" y="64.5" width="13" height="7.5" rx="3"/>
      <rect x="124.2" y="60" width="1.6" height="4.5"/>
      <rect x="154.2" y="60" width="1.6" height="4.5"/>
      <ellipse cx="125" cy="59.6" rx="8" ry="1.7"/>
      <ellipse cx="155" cy="59.6" rx="8" ry="1.7"/>
      <circle cx="140" cy="74" r="2.1"/>
    </g>
    <!-- ground and road -->
    <rect x="0" y="132" width="200" height="68" fill="#142c55"/>
    <path d="M90 132 H110 L150 200 H50 Z" fill="url(#road)"/>
    <path d="M100 136 V142 M100 148 V156 M100 163 V174 M100 182 V198" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M0 150 H200 M0 170 H200" stroke="#1d3d72" stroke-width="1"/>
    <!-- robot arm -->
    <g fill="#142c55" stroke="#142c55" stroke-linecap="round">
      <rect x="30" y="123" width="28" height="9" rx="2" stroke="none"/>
      <path d="M44 124 L55 95" stroke-width="7" fill="none"/>
      <path d="M55 95 L77 84" stroke-width="5.5" fill="none"/>
      <path d="M77 84 L83 91 M77 84 L85 80" stroke-width="2.6" fill="none"/>
      <circle cx="55" cy="95" r="5" stroke="none"/>
      <circle cx="77" cy="84" r="3.4" stroke="none"/>
    </g>
    <circle cx="55" cy="95" r="1.8" fill="#e8694b"/>
    <!-- humanoid robot, centred against the sun -->
    <g fill="#142c55">
      <rect x="99.2" y="85" width="1.6" height="7"/>
      <circle cx="100" cy="84.6" r="2.2"/>
      <rect x="92.5" y="91.5" width="15" height="11.5" rx="3.2"/>
      <rect x="98" y="103" width="4" height="2.4"/>
      <rect x="90.5" y="105" width="19" height="16.5" rx="3"/>
      <rect x="85.6" y="106" width="4.2" height="14" rx="2.1"/>
      <rect x="110.2" y="106" width="4.2" height="14" rx="2.1"/>
      <rect x="92.6" y="121" width="5.4" height="11" rx="1.4"/>
      <rect x="102" y="121" width="5.4" height="11" rx="1.4"/>
    </g>
    <circle cx="96.8" cy="97" r="1.6" fill="#e8694b"/>
    <circle cx="103.2" cy="97" r="1.6" fill="#e8694b"/>
    <rect x="95" y="110" width="10" height="2" rx="1" fill="#e8694b"/>
    <!-- autonomous mobile robot (AMR) carrying a crate -->
    <g fill="#142c55">
      <rect x="127" y="98" width="28" height="17" rx="1.4"/>
      <rect x="118" y="115" width="50" height="14" rx="3.6"/>
      <circle cx="126" cy="129.5" r="4.4"/>
      <circle cx="160" cy="129.5" r="4.4"/>
    </g>
    <path d="M127 103.5 H155" stroke="#f2c4b6" stroke-width="1.4"/>
    <rect x="139.2" y="98" width="3.6" height="5.5" fill="#f2c4b6"/>
    <rect x="121" y="120.4" width="36" height="2.6" rx="1.3" fill="#e8694b"/>
    <rect x="160.8" y="118.4" width="3.8" height="7.2" rx="1.3" fill="#f2c4b6"/>
    <circle cx="126" cy="129.5" r="1.6" fill="#f2c4b6"/>
    <circle cx="160" cy="129.5" r="1.6" fill="#f2c4b6"/>
    <!-- communications mast -->
    <g fill="#142c55">
      <path d="M175 132 L180 90 L185 132 Z"/>
      <circle cx="180" cy="88.5" r="2.6"/>
    </g>
    <path d="M186.5 82.5 a9 9 0 0 1 0 12 M173.5 82.5 a9 9 0 0 0 0 12" fill="none" stroke="#142c55" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#142c55" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1" stroke-dasharray="1.5 4"/>
</svg>
